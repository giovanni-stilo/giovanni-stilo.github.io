# Site settings
title: "Prof. Giovanni Stilo"
description: "Professor of Computer Science at Luiss University of Rome. Expert in Artificial Intelligence, Machine Learning, Explainable AI, Graph Counterfactual Explanations, Machine Unlearning, and Algorithmic Fairness."
url: "https://giovannistilo.eu"
baseurl: ""
author: "Giovanni Stilo"

# SEO
lang: "en"
logo: "/assets/img/profile.jpeg"
twitter:
  username: giovannistilo
social:
  name: Giovanni Stilo
  links:
    - https://scholar.google.com/citations?hl=en&user=uTyaicMAAAAJ
    - https://www.linkedin.com/in/giovanni-stilo-7986b816/
    - https://github.com/aiim-research

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:path/
  events:
    output: true
    permalink: /events/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "events"
    values:
      layout: "event"
  - scope:
      path: ""
    values:
      layout: "default"

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - priv_site-main
  - README.md
