<!-- Person Schema for SEO/GEO -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "mainEntity": {
    "@type": "Person",
    "@id": "{{ site.url }}/#person",
    "name": "Giovanni Stilo",
    "givenName": "Giovanni",
    "familyName": "Stilo",
    "jobTitle": "Professor of Computer Science",
    "honorificPrefix": "Prof.",
    "url": "{{ site.url }}",
    "image": "{{ site.url }}/assets/img/profile.jpeg",
    "email": "gstilo@luiss.it",
    "affiliation": {
      "@type": "Organization",
      "name": "Luiss University of Rome",
      "url": "https://www.luiss.it"
    },
    "alumniOf": [
      {
        "@type": "Organization",
        "name": "Sapienza University of Rome"
      }
    ],
    "knowsAbout": [
      "Artificial Intelligence",
      "Machine Learning",
      "Graph Neural Networks",
      "Explainable AI",
      "Graph Counterfactual Explanations",
      "Machine Unlearning",
      "Algorithmic Bias and Fairness",
      "Data Mining",
      "Social Network Analysis",
      "Network Medicine",
      "Recommender Systems",
      "Concept Drift Detection"
    ],
    "sameAs": [
      "https://scholar.google.com/citations?hl=en&user=uTyaicMAAAAJ",
      "https://github.com/aiim-research",
      "https://aiimlab.org",
      "https://www.linkedin.com/in/giovanni-stilo-7986b816/"
    ],
    "memberOf": {
      "@type": "Organization",
      "name": "AIIM - Artificial Intelligence & Information Mining Research Collective",
      "url": "https://aiimlab.org"
    }
  }
}
</script>

{% if page.layout == 'post' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{ page.title | escape }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "author": {
    "@type": "Person",
    "@id": "{{ site.url }}/#person",
    "name": "Giovanni Stilo"
  },
  "publisher": {
    "@type": "Person",
    "name": "Giovanni Stilo"
  },
  "url": "{{ page.url | absolute_url }}"
}
</script>
{% endif %}

<!-- Breadcrumb Schema -->
{% unless page.url == '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ site.url }}"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ page.title | default: 'Page' | escape }}",
      "item": "{{ page.url | absolute_url }}"
    }
  ]
}
</script>
{% endunless %}
