---
layout: default
---

<div class="container">
  <article class="event-content">
    {% unless page.notitle %}
    <h1 class="page-title">{{ page.title }}</h1>
    {% endunless %}
    {% if page.image %}
    <div class="event-image">
      <img src="{{ page.image }}" alt="{{ page.title }}" loading="lazy">
    </div>
    {% endif %}
    {{ content }}
  </article>
</div>
