---
layout: default
---

<div class="container">
  <article class="page-content post-content" itemscope itemtype="https://schema.org/BlogPosting">
    <header class="post-header">
      <h1 class="page-title" itemprop="headline">{{ page.title }}</h1>
      <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
        {{ page.date | date: "%B %d, %Y" }}
      </time>
    </header>
    <div itemprop="articleBody">
      {{ content }}
    </div>
  </article>
</div>
