---
layout: default
---

<div class="container">
  <article class="page-content">
    {% unless page.notitle %}
    <h1 class="page-title">{{ page.title }}{% if page.subtitle %}<span class="page-subtitle">{{ page.subtitle }}</span>{% endif %}</h1>
    {% endunless %}
    {{ content }}
  </article>
</div>
